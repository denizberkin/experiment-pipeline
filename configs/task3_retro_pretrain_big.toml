[experiment]
name = "task3_retro_pretrain_big"   # 20: masked-image pretraining on the unpaired retrospective split,
                                # then the same 10-epoch supervised fine-tune. seed 1 matches
                                # task3_film_seed1, so that run is the controlled baseline.
seed = 1
device = "cuda:0"
output_dir = "../runs"

[tracking]
name = "mlflow"

[tracking.params]
experiment_name = "task3-conditional-unet"
run_name = "task3_retro_pretrain_big"
tracking_uri = "sqlite:////home/ruru/Documents/deniz/mri_fields/mrixfields-analysis/mlflow.db"

[registry]
paths = [
  "../components/data/task3.py",
  "../components/models/conditional_unet.py",
  "../components/losses/reconstruction.py",
  "../components/training/task3.py",
]

[data]
name = "task3_paired"

[data.params]
modalities = ["T1W", "T2W", "T2FLAIR"]
field_strengths = ["0.1T", "1.5T", "3T", "5T", "7T"]
crop_size = [368, 448]
batch_size = 64
num_workers = 8
data_dir = "/home/ruru/Documents/deniz/mri_fields/data"
preprocessed_dir = "/home/ruru/Documents/deniz/mri_fields/data_preprocessed"
seed = 1
include_retro = true          # builds data["pretrain"] from retro_train; required by pretrain_steps > 0
use_preprocessed = true
require_complete = true
prospective_split = "pro_train"
retrospective_split = "retro_train"
holdout_subjects = []         # only 3 paired subjects exist; holding one out costs 33% of the training data
horizontal_flip = 0.5

[model]
name = "task3_conditional_unet"

[model.params]
input_channels = 1
output_channels = 1
num_domains = 15
base_channels = 32
max_channels = 512
levels = 4
# A1.1: zero-init residual head instead of Conv+Tanh, so step 0 is the
# identity the challenge already scores at SSIM 0.836.
residual_output = true
# A3.1: zero-init FiLM after both norms of every decoder block, on top of
# the bottleneck add, so step 0 still reproduces task3_unet_pro exactly.
film_conditioning = true

[training]
name = "task3_unet_trainer"

[training.params]
# Scale-up of the run that scored 0.901633. Two axes at once, both of which were left on the
# table: the full retrospective split (1939 volumes, ~427k slices, vs 883/194k) and 30000 steps
# vs 12000. masked_l1 was still falling at 0.0628 when the first run stopped, so neither axis
# was saturated. At batch 64 one pass over the full set is ~6670 steps, so this is ~4.5 passes.
pretrain_steps = 30000
mask_ratio = 0.5
mask_patch_size = 16
pretrain_learning_rate = 0.0001
# The defaults here are 0.0/0.99, which are GAN betas. This is a plain L1 reconstruction,
# so use the standard Adam pair instead.
pretrain_beta1 = 0.9
pretrain_beta2 = 0.999
pretrain_save_every = 10000
pretrain_print_every = 250
# 25 not 10: the previous run's fine-tune was capped at 10 only to match task3_film_seed1 as a
# control. e10 here stays directly comparable to that run (same seed, same architecture, only the
# pretraining scaled), and e15-e25 test whether a pretrained model keeps improving where the
# non-pretrained one plateaued at e20 locally -- a plateau measured with a ruler that section 19.1
# showed is blind to generalisation.
epochs = 25
learning_rate = 0.0001
beta1 = 0.9
beta2 = 0.999
save_every = 5               # 100 MB each; 5 points over 25 epochs
log_checkpoints = false      # skip the byte-identical mlruns/ copy; runs/<name>/artifacts/ already has it
amp = true
progress = true
progress_interval = 5.0
early_stopping_patience = 0        # fixed epoch budget, not early stopping
early_stopping_min_delta = 0.0001
early_stopping_restore_best = true

[[losses]]
name = "task3_l1"
weight = 1.0

[[losses]]
name = "task3_lpips"
weight = 0.05

[losses.params]
net = "alex"
