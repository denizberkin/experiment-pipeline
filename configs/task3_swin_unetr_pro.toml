[experiment]
name = "task3_swin_unetr"    # prospective only, conditioned, BraTS21-pretrained Swin UNETR
seed = 0
device = "cuda:0"
output_dir = "../runs"

[tracking]
name = "mlflow"

[tracking.params]
experiment_name = "task3-conditional-swin-unetr"
run_name = "task3_swin_unetr_pro"
tracking_uri = "sqlite:///mlflow.db"    # cwd-relative: launch from mrixfields-analysis/

[registry]
paths = [
  "../components/data/task3_volume.py",
  "../components/models/conditional_swin_unetr.py",
  "../components/losses/reconstruction.py",
  "../components/training/task3.py",
]

# Volumetric, so nothing here can be matched to the 2D configs. Three subjects
# exist (0006, 0007, 0009) and each contributes 3 modalities x 20 ordered field
# pairs = 60 pairs; holding 0009 out leaves 120 training pairs and 60 for
# validation. Volumes are 364x436x364 at 0.5 mm and already scaled to [0, 1].
[data]
name = "task3_paired_volume"

[data.params]
modalities = ["T1W", "T2W", "T2FLAIR"]
field_strengths = ["0.1T", "1.5T", "3T", "5T", "7T"]
crop_size = [96, 96, 96]     # must be divisible by 32; 128 is BraTS's size but costs 2.4x the memory
batch_size = 2
samples_per_epoch = 400      # an epoch is a choice here, not a dataset size: 200 steps
validation_samples = 100
holdout_subjects = ["0009"]  # the only way to see overfitting: challenge val targets are withheld
num_workers = 4
data_dir = "/home/ruru/Documents/deniz/mri_fields/data"
cache_dir = "/home/ruru/Documents/deniz/mri_fields/data_preprocessed/volumes_3d"
prospective_split = "pro_train"
flip_probability = 0.5
foreground_threshold = 0.02  # a 0.5 mm head volume is mostly air; 7T volumes mean ~0.045 overall
foreground_attempts = 8
seed = 0

[model]
name = "task3_conditional_swin_unetr"

[model.params]
# feature_size must be 48 to match the released fold; the loader sums the 4
# BraTS input channels down to 1 and drops the 3-class segmentation head.
pretrained_path = "/home/ruru/Documents/deniz/mri_fields/mrixfields-analysis/swin_unetr_fold1_f48_ep300_4gpu_dice0_9059/model.pt"
feature_size = 48
input_channels = 1
output_channels = 1
num_domains = 15
use_v2 = false               # the released fold is v1; v2 changes the encoder blocks
freeze_encoder = false
dropout_path_rate = 0.2      # stochastic depth, the main regulariser for 62M params on 2 subjects
drop_rate = 0.0
attn_drop_rate = 0.0
use_checkpoint = false       # trades ~40% speed for memory; enable to raise crop_size or batch_size

[training]
name = "task3_unet_trainer"

[training.params]
pretrain_steps = 0
epochs = 60                  # 60 x 200 = 12,000 optimizer steps
learning_rate = 0.0001       # the 0.15M fresh params: domain embeddings, conditioning head, output conv
encoder_lr_scale = 0.1       # the 62.2M restored params step at 1e-5; drop to 0.05 if validation turns up early
beta1 = 0.9                  # 0.5 is a GAN convention; this is plain reconstruction
beta2 = 0.999
weight_decay = 0.00001
save_every = 10
amp = true
progress = true
progress_interval = 5.0
early_stopping_monitor = "validation"
early_stopping_patience = 10
early_stopping_min_delta = 0.0001
early_stopping_restore_best = true

[[losses]]
name = "task3_l1"
weight = 1.0

[[losses]]
name = "task3_lpips"
weight = 0.05                # scored over the 96 axial slices of each crop and averaged

[losses.params]
net = "alex"
